server {
    listen 80;
    server_name _; # Replace with your domain name or EC2 Public IP / DNS

    # Frontend (React + Vite build)
    root /home/ubuntu/Course_management_system/frontend/dist;
    index index.html;

    # Handle SPA routing (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API Proxy (Port 8000)
    location ~ ^/(api|courses|instructor|admin)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Increase max upload size for course materials / images / videos
    client_max_body_size 50M;
}
