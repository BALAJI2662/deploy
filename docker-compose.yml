services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: cms-backend
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    ports:
      - "8000:8000"
    networks:
      - cms-network
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); http.get('http://127.0.0.1:8000/', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1));"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cms-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cms-network

networks:
  cms-network:
    driver: bridge
